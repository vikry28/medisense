# Plaintext listener retained for local debugging (for example a quick
# mosquitto_pub against localhost). Use 8883 over TLS for real clients.
listener 1883 0.0.0.0
protocol mqtt

# TLS listener. Development certificates are generated by the
# mosquitto-cert-init Compose service into the mosquitto-certs volume.
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
